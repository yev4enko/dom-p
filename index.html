<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>PostUrBrainsOut||DOM</title>
    <link rel="stylesheet" href="styles.css">
    <script src="brains.js" defer></script>
</head>

<body class="style1">
    <div class="header-container">
        <div class="logo">P.U.B.O.</div>
    </div>
    <div class="content-container">
        <nav class="navbar-container">
            <div class="nav-list">
                <div class="nav-links obertka">
                    <button class="nav-links-btn nav-btn">.links.d.d</button>
                    <ul class="ddlists nav-l">
                        <a target="_blank" href="https://discord.com/">.discord</a>
                        <a target="_blank" href="https://www.youtube.com/watch?v=dQw4w9WgXcQh">.youtube</a>
                        <a target="_blank" href="https://github.com/yev4enko/dom-p">.github</a>
                    </ul>
                </div>
                <div class="nav-help obertka">
                    <button class="nav-help-btn nav-btn">.help!.d.d</button>
                    <ul class="ddlists hel-l">
                        <a target="_blank">help1</a>
                        <a target="_blank">help2</a>
                        <a target="_blank">help3</a>
                    </ul>
                </div>
                <div class="nav-settings obertka">
                    <button class="nav-settings-btn nav-btn">.settings.d.d</button>
                    <ul class="ddlists sett-b">
                        <button>color1</button>
                        <button>color2</button>
                        <button>color3</button>
                    </ul>
                </div>
                <div class="nav-color obertka">
                    <button class="nav-color-btn nav-btn">.style.d.d</button>
                    <ul class="ddlists styles-b">
                        <button class="default">styleD</button>
                        <button class="style1">style1</button>
                        <button class="style2">style2</button>
                        <button class="style3">style3</button>
                        <button class="style4">style4</button>
                        <button class="style5">style5</button>
                        <button class="style6">style6</button>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="create-see-container">
            <nav class="post-nav">
                <img class="lock2"src="./img/list.png">
                <button class="btns mid1">a</button>
                <button class="btns">r</button>
            </nav>
            <div class="post-container">
                <div class="post-area">
                    <h1>Post Title: max 100 symbols.</h1>
                    <textarea class="tittle"></textarea>
                    <h1>Description: max 2500 sybols.</h1>
                    <textarea class="description"></textarea>
                    <h1>Add Media</h1>
                </div>
                <div class="publish-buttons">
                    <button class="cancel">Cancel</button>
                    <button class="apply">Puslish</button>
                </div>
            </div>
        </div>
        <div class="recent-posts-container sizing">2</div>
    </div>
</body>

</html>
