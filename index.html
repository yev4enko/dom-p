<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>PostUrBrainsOut||DOM</title>
    <link rel="stylesheet" href="styles.css">
    <script src="brains.js" defer></script>
    <script src="https://kit.fontawesome.com/4f31497266.js" crossorigin="anonymous"></script>
</head>

<body class="style-black">
    <div class="header-container">
        <div class="logo">P.U.B.O.</div>
        <div class="styleing">
            <button class="styleing-button">
                <i class="fa-regular fa-moon"></i></button>
        </div>
        <div class="settings-button">
            <i class="fa-solid fa-gear"></i>
        </div>
    </div>
    <div class="content-container">
        <nav class="navbar-container">
            <div class="nav-list">
                <div class="create-post obertka">
                    <button class="nav-btn create-post-button">.create.</button>
                </div>
                <div class="nav-links obertka">
                    <button class="nav-btn">.links.d.d</button>
                    <ul class="ddlists nav-l">
                        <a target="_blank" href="https://discord.com/">.discord</a>
                        <a target="_blank" href="https://www.youtube.com/watch?v=dQw4w9WgXcQh">.youtube</a>
                        <a target="_blank" href="https://github.com/yev4enko/dom-p">.github</a>
                    </ul>
                </div>
                <div class="nav-help obertka">
                    <button class="nav-btn">.help!.d.d</button>
                    <ul class="ddlists hel-l">
                        <a target="_blank">help1</a>
                        <a target="_blank">help2</a>
                        <a target="_blank">help3</a>
                    </ul>
                </div>
            </div>
            <div class="locked">
                <div><i class="fa-solid fa-angle-left"></i></div>
                <button><i class="fa-solid fa-lock-open"></i></button>
            </div>
        </nav>
        <div class="create-see-container">
            <div class="post-container">
                <div class="post-area">
                    <h1>Post Title: max 100 symbols.</h1>
                    <textarea class="tittle"></textarea>
                    <h1>Description: max 2500 sybols.</h1>
                    <textarea class="description"></textarea>
                    <h1>Add Media</h1>
                </div>
                <div class="publish-buttons">
                    <button class="cancel">Cancel</button>
                    <button class="apply">Puslish</button>
                </div>
            </div>
        </div>
        <div class="recent-posts-container sizing">2</div>
    </div>
</body>

</html>
