<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>PostUrBrainsOut||DOM</title>
    <link rel="stylesheet" href="../styles.css">
    <script type="module" src="../index.js" defer></script>
    <script type="module" src="../scripts/navbar.js" defer></script>
    <script type="module" src="../scripts/UA/register.js" defer></script>
    <script src="https://kit.fontawesome.com/4f31497266.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav id="navbar-container" class="navbar-container">
    </nav>
    <div id = "register-container" class="register-container">
        <form id="register" class="register">
            <div class="login-title-wraper">
                <div id="register-title"><span>SIGN UP</span></div>
            </div>
            <div class="register-inputs">
                <div class="register-input-wraper">
                    <div class="star">*</div>
                    <input id="firstname-register" placeholder="FIRSTNAME" type="text">
                </div>
                <div class="register-input-wraper">
                    <div class="star">*</div>
                    <input id="lastname-register" placeholder="LASTNAME" type="text">
                </div>
                <div class="register-input-wraper">
                    <div class="star">*</div>
                    <input id="phone-register" placeholder="PHONE-NUMBER" type="text">
                </div>
                <div class="register-input-wraper">
                    <div class="star">*</div>
                    <input id="email-register" placeholder="E-MAIL" type="text">
                </div>
                <div class="register-input-wraper">
                    <div class="star">*</div>
                    <input id="password-register1" placeholder="PASSWORD" type="text">
                </div>
                <div class="register-input-wraper">
                    <div class="star">*</div>
                    <input id="password-register2" placeholder="PASSWORD" type="text">
                </div>
            </div>

            <div class="register-nav">
                <div class="register-nav-btn-wraper">
                    <button id="cancel-register">CANCEL</button>
                </div>
                <div class="register-nav-btn-wraper">
                    <button id="sign-up">CREATE USER</button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
